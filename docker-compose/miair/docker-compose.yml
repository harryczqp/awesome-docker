services:
  mi-air:
    image: mrdeer1997/miair-next:latest
    container_name: miair-next
    restart: unless-stopped
    network_mode: host
    environment:
      MIAIR_WEB_PORT: "8300"
    volumes:
      - data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
volumes:
  data: