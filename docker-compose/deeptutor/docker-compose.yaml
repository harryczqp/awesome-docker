services:
  deeptutor:
    image: ghcr.io/hkuds/deeptutor:latest
    deploy:
      resources:
        limits:
          cpus: '2.00'       # 文档解析等任务较重，按实际负载调整
          memory: 4G
    pull_policy: always
    container_name: deeptutor
    env_file:
      - /etc/configs/deeptutor/.env
    networks:
      - deeptutor-network
    ports:
      - "3782:3782"          # Web 界面
      - "8001:8001"          # 后端 API
    volumes:
      - data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

volumes:
  data:

networks:
  deeptutor-network:
    driver: bridge
